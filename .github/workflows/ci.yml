name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The validator is standard library only, so there is nothing to install.
      - name: Validate SKILL.md frontmatter, metadata and conventions
        run: python tools/validate_skills.py

  first-party:
    name: Validate with the Claude Code CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # A cold npx download of the CLI took 7 minutes on one run and 13 seconds on
      # another. Cache it on a weekly key: fast on most runs, and still picks up a
      # new release within a week, which is soon enough for a drift detector.
      - name: Compute weekly cache key
        id: week
        run: echo "key=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-claude-code-${{ steps.week.outputs.key }}
          restore-keys: npx-claude-code-

      # First-party validation of the manifests and the skills, which our own
      # validator cannot replicate: it is the same check the plugin directory runs.
      # Tracks @latest on purpose. If a CLI release starts failing this, the spec
      # moved and the repo genuinely needs attention -- that is the signal we want,
      # even at the cost of an occasional surprise red build.
      - name: Validate marketplace and plugin manifests
        run: npx -y @anthropic-ai/claude-code@latest plugin validate ./ --strict

      - name: Validate skills
        run: npx -y @anthropic-ai/claude-code@latest plugin validate skills --strict

  evals:
    name: Validate evals and script snapshots
    # Both legs matter here: the snapshots compare byte counts, so this is what would
    # catch a line-ending or path-handling difference between platforms.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate eval cases and snapshot-test bundled scripts
        run: python tools/validate_evals.py

  scripts:
    name: Smoke-test bundled scripts
    # Cross-platform is a claim these scripts make, so both legs are load-bearing:
    # Windows is where console encoding and a missing `python3` actually break them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: collect_pr_context.py runs and leaves the repo untouched
        shell: bash
        run: |
          set -euo pipefail
          python skills/pr-branch-summary/scripts/collect_pr_context.py \
            --base "$(git rev-parse HEAD)" --max-diff-lines 20 > /dev/null
          # The skill promises it never writes to the working tree.
          test -z "$(git status --porcelain)" || {
            echo "script modified the working tree:"; git status --porcelain; exit 1;
          }

      - name: Bundled scripts are syntactically valid
        shell: bash
        run: |
          set -euo pipefail
          find skills -name '*.py' -print0 | xargs -0 -n1 python -m py_compile
